services:


  PostgreSQL: #done
    image: postgres:14.22
    container_name: PostgreSQL
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgreSQL:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8083:80"

  redis: #done
    image: redis:8.8-m03
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    restart: always

  backend: #
    build: ./backend
    container_name: backend
    environment:
      PORT: 8001 #8000 kvli fast api L2
      DB_HOST: PostgreSQL
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: decp_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8001"
    ports:
      - '8001:8001'
    restart: always
    depends_on:
      - PostgreSQL
      - redis

  frontend: #NEED DOCKERFILE
    build: ./frontend
    container_name: frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    ports:
      - '3000:5173'
    restart: always
    depends_on:
      - backend
  proxy:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:81"
    ports:
      - "81:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana:/var/lib/grafana
    restart: always

  ml: 
    build: ./ML
    ports:
      - "8880:8880"
    runtime: nvidia
    depends_on:
      - PostgreSQL
      - redis

networks:
  default:
    name: decp-network

volumes:
  redis:
  postgreSQL:
  grafana: