name: decp

services:
  db:
    image: timescale/timescaledb:latest-pg17   # připni konkrétní tag
    container_name: decp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${L3_DB_PORT:-5432}:5432"     # jen lokálně (DBeaver/pgAdmin); na serveru klidně smaž
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: decp-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: decp-backend
    environment:
    
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '8001:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.localhost`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.services.backend.loadbalancer.server.port=8000
    restart: unless-stopped

  frontend:
    build: ./frontend                 # Dockerfile ok
    container_name: decp-frontend
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`localhost`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=5173
    restart: unless-stopped

  proxy:
    image: traefik:v3.6               # ověř aktuální tag
    container_name: decp-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false   # bez toho Traefik vystaví i DB, Redis...
      - --entrypoints.web.address=:80
      - --api.insecure=true                         # dashboard jen pro vývoj
    ports:
      - "${L3_HTTP_PORT:-80}:80"                                   # host 81 -> uvnitř 80
      - "127.0.0.1:${L3_DASH_PORT:-8080}:8080"                       # dashboard jen z localhostu
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0     # ověř/připni tag
    container_name: decp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://grafana.localhost:81
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

  # Volitelné: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: decp-pgadmin
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # GPU služba: docker compose --profile gpu up -d  (jen na stroji s nvidia-container-toolkit, tj. desktop)
  ml:
    build: ./ML
    container_name: decp-ml
    profiles: [gpu]
    ports:
      - "127.0.0.1:8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: decp-network

volumes:
  postgres_data:
  redis_data:
  grafana_data: