name: L2 CI – lint, format & build

on:
  push:
    branches: ["main"]
    paths:
      - "L2/**"
      - ".github/workflows/l2-ci.yml"
  pull_request:
    paths:
      - "L2/**"
      - ".github/workflows/l2-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Ruff lint
        run: pipx run ruff check L2

      - name: Ruff format check
        run: pipx run ruff format --check L2

  build:
    needs: lint # jen když lint prošel
    if: github.event_name == 'push' # jen po sloučení do main, ne u PR
    runs-on: ubuntu-24.04-arm # nativní arm64 = stejné CPU jako Pi
    permissions:
      contents: read # číst kód
      packages: write # zapisovat do GHCR
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push L2 API image
        uses: docker/build-push-action@v7
        with:
          context: L2/L2_Gateway/L2_API
          push: true
          tags: |
            ghcr.io/raduas/decp-l2-api:${{ github.sha }}
            ghcr.io/raduas/decp-l2-api:latest
