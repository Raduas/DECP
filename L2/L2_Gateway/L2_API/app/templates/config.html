<!DOCTYPE html>
<html>

<head>
    <title>Device Config</title>
</head>

<body>
    <h2>Device: {{ deviceID }}</h2>
    <label>Type:</label>
    <select id="typeMeasurement">
        <option value="CONTINUAL" {% if config.typeMeasurement=="CONTINUAL" %} selected {% endif %}>
            CONTINUAL
        </option>
        <option value="SESSION" {% if config.typeMeasurement=="SESSION" %} selected {% endif %}>
            SESSION
        </option>
    </select>


    <br><br>
    <label>Interval (Hz):</label>
    <input type="number" id="hz" name="measIntervalHz" value="{{ config.measIntervalHz }}" step="any" />
    <br><br>

    <button onclick="sendConfig()">
        UPDATE CONFIG
    </button>


    <script>
        async function sendConfig() {
            const data = {
                deviceID: "{{ deviceID }}",
                typeMeasurement:
                    document.getElementById("typeMeasurement").value,
                measIntervalHz:
                    parseFloat(document.getElementById("hz").value)
            };
            await fetch("/devices/config/update", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });
            alert("Config updated");
        }
    </script>
</body>

</html>
