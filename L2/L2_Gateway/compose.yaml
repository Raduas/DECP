services:

  api:
    build: ./L2_API
    container_name: fastapi
    environment:
      PORT: 8000
    ports:
      - '8000:8000'
    restart: always
    volumes:
      - ./L2_data:/app/database
    depends_on:
      - mqtt5
    #command: "true"

  node-red:
    image: nodered/node-red:latest
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "1880:1880"
    
    volumes:
      - ./L2_nodered/node-red-data:/data
      - ./L2_data:/database
    depends_on:
      - mqtt5
    command: "true"

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./L2_data:/data
    # Tady musíš zadat přesný název tvého DB souboru! 
    # Podle předchozích zpráv se jmenuje L2gateway.db
    entrypoint: sqlite_web -H 0.0.0.0 -p 8080 /data/L2.db
    depends_on:
      - api
    #command: "true"


  mqtt5:
    image: eclipse-mosquitto
    container_name: mqtt5
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - ./L2_MQTT/config:/L2_MQTT/config:rw
      - ./L2_MQTT/data:/L2_MQTT/data:rw
      - ./L2_MQTT/log:/L2_MQTT/log:rw
    
    restart: always

  #ml:
    #image: tensorflow/tensorflow:2.3.0-gpu
    # Make Docker create the container with NVIDIA Container Toolkit
    # You don't need it if you set 'nvidia' as the default runtime in
    # daemon.json.
   # runtime: nvidia
    # the lines below are here just to test that TF can see GPUs
    #entrypoint:
   #   - /usr/local/bin/python
   #   - -c
   # command:
   #   - "import tensorflow as tf; tf.test.is_gpu_available(cuda_only=False, min_cuda_compute_capability=None)"



  ml:
    #image: my-ml-app:latest
    build: ./L2_ML
    ports:
      - 8880:8880
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # nebo count: 1
              capabilities: [gpu]

      #- workspace:/workspace
      #- data:/data

# volumes for mapping data,config and log
volumes:
  node-red-data:
  config:
  data:
  log:

networks:
  net:
    name: net
  default:
    name: mqtt5-network
