services:

  api:
    build: ./L2_API
    container_name: fastapi
    environment:
      PORT: 8000
    ports:
      - '8000:8000'
    restart: always
    volumes:
      - ./L2_data:/app/database
    depends_on:
      - mqtt5


  node-red:
    image: nodered/node-red:latest
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "1880:1880"
    
    volumes:
      - ./L2_nodered/node-red-data:/data
      - ./L2_data:/database
    depends_on:
      - mqtt5
    command: "true"

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./L2_data:/data
    entrypoint: sqlite_web -H 0.0.0.0 -p 8080 /data/L2.db
    depends_on:
      - api



  mqtt5:
    image: eclipse-mosquitto
    container_name: mqtt5
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - ./L2_MQTT/config:/L2_MQTT/config:rw
      - ./L2_MQTT/data:/L2_MQTT/data:rw
      - ./L2_MQTT/log:/L2_MQTT/log:rw
    
    restart: always
    
  ml:
    build: ./L2_ML
    ports:
      - 8880:8880
    runtime: nvidia
    volumes:
      - ./L2_data:/app/database

# volumes for mapping data,config and log
volumes:
  node-red-data:
  config:
  data:
  log:

networks:
  net:
    name: net
  default:
    name: mqtt5-network
