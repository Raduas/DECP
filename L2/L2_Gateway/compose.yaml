services:

  api:
    image: ghcr.io/raduas/decp-l2-api:latest   # ← nový řádek
    build: ./L2_API
    container_name: fastapi
    networks: [default]
    environment:
      PORT: 8000
      L3_URL: ${L3_URL}
    ports:
      - '8000:8000'
    restart: always
    volumes:
      - ./L2_data:/app/database
    depends_on:
      - mqtt5


  node-red:
    image: nodered/node-red:latest
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "1880:1880"
    
    volumes:
      - ./L2_nodered/node-red-data:/data
      - ./L2_data:/database
    depends_on:
      - mqtt5
    command: "true"

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    profiles: [tools]          # ← nový řádek: spustí se jen s --profile tools
    restart: always
    ports:
      - "8089:8089"
    volumes:
      - ./L2_data:/data
    entrypoint: sqlite_web -H 0.0.0.0 -p 8089 /data/L2.db
    depends_on:
      - api



  mqtt5:
    image: eclipse-mosquitto
    container_name: mqtt5
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    # image bez command spouští /mosquitto-no-auth.conf a náš config ignoruje
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./L2_MQTT/config:/mosquitto/config:rw
      - ./L2_MQTT/data:/mosquitto/data:rw
      - ./L2_MQTT/log:/mosquitto/log:rw
    restart: always
    

  CV_NN:
    build: ./L2_CV_NN
    container_name: cv-nn
    # rozpracované (cv2.imshow v kontejneru nepoběží) -> spouštět jen explicitně: docker compose --profile cv up
    profiles: [cv]
    networks: [default]
    environment:
      PORT: 8050
    ports:
      - '8050:8050'
    restart: always
    volumes:
      - ./L2_data:/app/database
    depends_on:
      - api


# volumes for mapping data,config and log
volumes:
  node-red-data:
  config:
  data:
  log:

networks:
  net:
    name: net
  default:
    name: mqtt5-network
