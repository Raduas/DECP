allow_anonymous true
listener 1883 0.0.0.0
listener 9001
protocol websockets
persistence true
# autentizace zatím vypnutá (L1 i L2 se připojují anonymně); pwfile vytvořit přes mosquitto_passwd
#password_file /mosquitto/config/pwfile
persistence_file mosquitto.db
persistence_location /mosquitto/data/
log_dest stdout
